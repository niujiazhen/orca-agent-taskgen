name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure Linux offscreen rendering
        if: runner.os == 'Linux'
        shell: bash
        run: echo "MUJOCO_GL=egl" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[visualization,dev]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/wheel_smoke.py
      - run: orca-task generate src/orca_sim/taskgen/specs/v2_pick_place_cylinder.yaml --output build/ci-generated
      - run: orca-task check-runtime build/ci-generated/bluecylinderplace_v0 --steps 200
      - run: orca-task preview build/ci-generated/bluecylinderplace_v0 --max-steps 100
