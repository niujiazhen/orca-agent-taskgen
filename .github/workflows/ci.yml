name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Configure Windows software OpenGL
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@6657792673a5d162d5f244db991ba45b4b68989f # v2
      - name: Configure Linux offscreen rendering
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libosmesa6 libgl1
          echo "MUJOCO_GL=osmesa" >> "$GITHUB_ENV"
          echo "PYOPENGL_PLATFORM=osmesa" >> "$GITHUB_ENV"
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[photo,visualization,dev]"
      - run: python scripts/sync_skills.py --check
      - run: python -m pytest -q
      - run: python -m build
      - run: python scripts/wheel_smoke.py
      - run: python scripts/photo_smoke.py --output build/ci-photo --full
      - run: orca-task generate src/orca_sim/taskgen/specs/v2_pick_place_cylinder.yaml --output build/ci-generated
      - run: orca-task check-runtime build/ci-generated/bluecylinderplace_v0 --steps 200
      - run: orca-task preview build/ci-generated/bluecylinderplace_v0 --max-steps 100
