[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca_sim"
version = "0.2.0"
description = "Generate visualizable ORCA hand MuJoCo RL environments from bounded task descriptions."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Francesco Capuano", email = "capuano@robots.ox.ac.uk"},
]
dependencies = [
  "gymnasium>=0.29",
  "jsonschema>=4.18",
  "mujoco>=3.1",
  "numpy>=1.26",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
visualization = [
  "imageio[ffmpeg]>=2.34",
]

[project.scripts]
orca-task = "orca_sim.taskgen.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orca_sim = [
  "*.xml",
  "taskgen/schemas/*.json",
  "taskgen/specs/*.yaml",
  "taskgen/gestures/*.yaml",
  "taskgen/generated/**/*.xml",
  "taskgen/generated/**/*.yaml",
  "taskgen/generated/**/*.json",
  "scenes/*/*.xml",
  "assets/mjcf/*.xml",
  "assets/mjcf/*/*.xml",
  "assets/mjcf/left/visual/*.stl",
  "assets/mjcf/left/collision/*.stl",
  "assets/mjcf/right/visual/*.stl",
  "assets/mjcf/right/collision/*.stl",
  "models/mjcf/*.mjcf",
  "models/*/*.mjcf",
  "models/*/assets/mjcf/*/*.stl",
]
